name: Build Android Release AAB

# Builds a signed Android App Bundle (.aab) ready to upload to the Google
# Play Console. Runs on every push to main that touches the native app or
# web bundle, and can also be triggered manually from the Actions tab.
#
# .env.production is committed to this repo, so Next.js picks up the
# NEXT_PUBLIC_* values automatically during the build (same as Xcode
# Cloud does for the iOS build) - no env secrets needed here.
#
# Requires these repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   ANDROID_KEYSTORE_BASE64        base64 of android/app/howsthefield-release.jks
#   ANDROID_KEYSTORE_PASSWORD      keystore.properties storePassword
#   ANDROID_KEY_ALIAS              keystore.properties keyAlias
#   ANDROID_KEY_PASSWORD           keystore.properties keyPassword

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'icons/**'
      - 'resources/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build static web bundle
        run: npm run cap:build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/howsthefield-release.jks

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/howsthefield-release.jks
          EOF

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
